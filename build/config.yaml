database:
    driver: sqlite
    path: ./data/living-recorder.db
ffmpeg:
    path: ffmpeg
mediamtx:
    preview_retry: 60
    rtmp_url: rtmp://192.168.2.102:1935
    url: http://192.168.2.102:8889
recorder:
    default_audio_codec: aac
    default_output_template: '{name}/{date}_{time}.mp4'
    default_video_codec: libx264
    health_check_interval: 30
    max_parallel: 50
    restart_on_failure: 3
    segment_duration: 600
    retry_with_re_encode: true
server:
    mode: debug
    port: "8080"
storage:
    default: local
    local:
        path: ./recordings
    s3:
        access_key: ""
        bucket: ""
        endpoint: ""
        region: ""
        secret_key: ""
