name: CI

on:
  push:
    branches: [main]
    tags: [v*]
  pull_request:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release-native:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: .exe
          - name: windows-arm64
            goos: windows
            goarch: arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Extract version
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build
          cp -r dist ../backend/embed/
      - name: Build ${{ matrix.target.name }} (system ffmpeg)
        working-directory: ./backend
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          VERSION: ${{ env.VERSION }}
        run: CGO_ENABLED=0 go build -o "../living-recorder-${VERSION}-${{ matrix.target.name }}${{ matrix.target.ext }}" .
      - name: Upload ${{ matrix.target.name }}
        uses: softprops/action-gh-release@v3
        with:
          files: living-recorder-${{ env.VERSION }}-${{ matrix.target.name }}${{ matrix.target.ext }}

  release-embed:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-native
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        target:

          - name: linux-amd64-embedded-ffmpeg
            goos: linux
            goarch: amd64
            ext: ""
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            ffmpeg_archive: ffmpeg.tar.xz
            ffmpeg_bin_dir: ffmpeg-master-latest-linux64-gpl/bin
          - name: linux-arm64-embedded-ffmpeg
            goos: linux
            goarch: arm64
            ext: ""
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linuxarm64-gpl.tar.xz
            ffmpeg_archive: ffmpeg.tar.xz
            ffmpeg_bin_dir: ffmpeg-master-latest-linuxarm64-gpl/bin
          - name: windows-amd64-embedded-ffmpeg
            goos: windows
            goarch: amd64
            ext: .exe
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
            ffmpeg_archive: ffmpeg.zip
            ffmpeg_bin_dir: ffmpeg-master-latest-win64-gpl/bin
          - name: windows-arm64-embedded-ffmpeg
            goos: windows
            goarch: arm64
            ext: .exe
            ffmpeg_url: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-winarm64-gpl.zip
            ffmpeg_archive: ffmpeg.zip
            ffmpeg_bin_dir: ffmpeg-master-latest-winarm64-gpl/bin
      max-parallel: 1
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache-dependency-path: backend/go.sum
      - name: Extract version
        run: echo "VERSION=${{ github.ref_name }}" >> $GITHUB_ENV
      - name: Build frontend
        run: |
          cd frontend && npm ci && npm run build
          cp -r dist ../backend/embed/
      - name: Download static ffmpeg
        run: |
          mkdir -p backend/embed/ffmpeg
          curl -fL "${{ matrix.target.ffmpeg_url }}" -o "/tmp/${{ matrix.target.ffmpeg_archive }}"
          case "${{ matrix.target.ffmpeg_archive }}" in
            *.zip) unzip -o "/tmp/${{ matrix.target.ffmpeg_archive }}" -d /tmp ;;
            *.tar.xz|*.tar*) tar -xf "/tmp/${{ matrix.target.ffmpeg_archive }}" -C /tmp ;;
          esac
          cp "/tmp/${{ matrix.target.ffmpeg_bin_dir }}/ffmpeg${{ matrix.target.ext }}" backend/embed/ffmpeg/
          cp "/tmp/${{ matrix.target.ffmpeg_bin_dir }}/ffprobe${{ matrix.target.ext }}" backend/embed/ffmpeg/ || true
      - name: Build ${{ matrix.target.name }} (embedded ffmpeg)
        working-directory: ./backend
        env:
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          VERSION: ${{ env.VERSION }}
        run: CGO_ENABLED=0 go build -tags embedffmpeg -o "../living-recorder-${VERSION}-${{ matrix.target.name }}${{ matrix.target.ext }}" .
      - name: Upload ${{ matrix.target.name }}
        if: matrix.target.name != 'windows-arm64-embedded-ffmpeg'
        uses: softprops/action-gh-release@v3
        with:
          files: living-recorder-${{ env.VERSION }}-${{ matrix.target.name }}${{ matrix.target.ext }}
      - name: Upload ${{ matrix.target.name }} and generate release notes
        if: matrix.target.name == 'windows-arm64-embedded-ffmpeg'
        uses: softprops/action-gh-release@v3
        with:
          files: living-recorder-${{ env.VERSION }}-${{ matrix.target.name }}${{ matrix.target.ext }}
          generate_release_notes: true
